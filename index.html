<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GTM Company Research Agent</title>
<style>
  :root {
    --bg: #0D1117;
    --surface: #161B22;
    --surface-hover: #1C2333;
    --border: #2A3142;
    --accent: #3DDC97;
    --accent-dim: #2A9D6F;
    --text-primary: #E6EDF3;
    --text-secondary: #8B96A5;
    --warning: #E3B341;
    --danger: #F87171;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    margin: 0;
    padding: 0;
  }

  #service-down-banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(248, 81, 73, 0.15);
    border-bottom: 1px solid rgba(248, 81, 73, 0.4);
    color: var(--danger);
    padding: 14px 20px;
    font-size: 14px;
    text-align: center;
    transform: translateY(-100%);
    transition: transform 0.3s ease;
    z-index: 100;
  }

  #service-down-banner.visible {
    transform: translateY(0);
  }

  .page-content {
    max-width: 720px;
    margin: 0 auto;
    padding: 60px 20px 100px;
  }

  .header {
    margin-bottom: 32px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 6px;
    background: linear-gradient(90deg, var(--accent), #5EEAD4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin: 0;
  }

  .search-row {
    display: flex;
    gap: 10px;
    margin: 28px 0;
  }

  input {
    flex: 1;
    padding: 14px 16px;
    font-size: 15px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s ease;
  }

  input::placeholder {
    color: var(--text-secondary);
  }

  input:focus {
    border-color: var(--accent);
  }

  button {
    background: var(--accent);
    color: #06251A;
    border: none;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    min-width: 110px;
  }

  button:hover:not(:disabled) {
    background: #5EEAD4;
  }

  button:active:not(:disabled) {
    transform: scale(0.97);
  }

  button:disabled {
    background: var(--border);
    color: var(--text-secondary);
    cursor: not-allowed;
  }

  #status {
    font-size: 13px;
    color: var(--accent);
    min-height: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .spinner {
    width: 13px;
    height: 13px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #not-found-box {
    background: rgba(227, 179, 65, 0.1);
    border: 1px solid rgba(227, 179, 65, 0.4);
    color: var(--warning);
    padding: 14px 16px;
    border-radius: 10px;
    margin-top: 12px;
    font-size: 14px;
    display: none;
  }

  #results {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .field {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    animation: fadeIn 0.35s ease both;
  }

  .field:hover {
    background: var(--surface-hover);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .field-label {
    font-weight: 600;
    color: var(--accent);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 8px;
  }

  .field-value {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--text-primary);
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<div id="service-down-banner">Service is temporarily down. Please try again shortly.</div>

<div class="page-content">
  <div class="header">
    <h1>GTM Intelligence Agent</h1>
    <p class="subtitle">Autonomous company research, powered by Groq + live web search</p>
  </div>

  <div class="search-row">
    <input type="text" id="company-input" placeholder="Enter a company name, e.g. Anthropic" />
    <button id="submit-btn" onclick="runResearch()">Research</button>
  </div>

  <p id="status"></p>
  <div id="not-found-box"></div>
  <div id="results"></div>
</div>

<script>
const API_URL = "/api/research";
const PATIENCE_MESSAGE_DELAY_MS = 30000;
const COOLDOWN_DURATION_MS = 30000;
const SERVICE_DOWN_BANNER_DURATION_MS = 8000;

const FIELD_LABELS = {
  summary: "Summary",
  recent_news: "Recent News",
  employee_estimate: "Employee Estimate",
  industry: "Industry",
  suggested_talking_points: "Suggested Talking Points",
  draft_outreach_message: "Draft Outreach Message"
};

document.getElementById("company-input").addEventListener("keydown", (event) => {
  if (event.key === "Enter") runResearch();
});

async function runResearch() {
  const companyInput = document.getElementById("company-input");
  const submitButton = document.getElementById("submit-btn");
  const statusText = document.getElementById("status");
  const notFoundBox = document.getElementById("not-found-box");
  const resultsContainer = document.getElementById("results");

  if (submitButton.disabled) return;

  const companyName = companyInput.value.trim();
  if (!companyName) return;

  submitButton.disabled = true;
  submitButton.textContent = "Research";
  statusText.innerHTML = '<span class="spinner"></span> Researching, kindly wait for a bit...';
  notFoundBox.style.display = "none";
  resultsContainer.innerHTML = "";

  const patienceTimer = setTimeout(() => {
    statusText.innerHTML = '<span class="spinner"></span> Please hold on a little longer...';
  }, PATIENCE_MESSAGE_DELAY_MS);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ company_name: companyName })
    });

    const responseData = await response.json();

    if (!response.ok) {
      if (responseData.error === "not_found") {
        showNotFound(responseData.message || `'${companyName}' could not be found.`);
      } else {
        // Any backend error other than "not_found" (rate limits, provider
        // outages, database failures, or anything unanticipated) surfaces
        // identically here: the person using the tool doesn't need to know
        // which one occurred, only that it's temporary and not their fault.
        showServiceDownBanner();
      }
      statusText.textContent = "";
      submitButton.disabled = false;
      return;
    }

    renderBrief(responseData);
    statusText.textContent = "";
    startCooldown(submitButton);
  } catch (networkError) {
    // fetch() itself throwing (not the backend responding with an error
    // status) means the request never reached the server at all, a true
    // connectivity failure, which is exactly what the service-down banner
    // is for too.
    showServiceDownBanner();
    statusText.textContent = "";
    submitButton.disabled = false;
  } finally {
    clearTimeout(patienceTimer);
  }
}

function showNotFound(message) {
  const notFoundBox = document.getElementById("not-found-box");
  notFoundBox.textContent = message;
  notFoundBox.style.display = "block";
}

function showServiceDownBanner() {
  const banner = document.getElementById("service-down-banner");
  banner.classList.add("visible");
  setTimeout(() => banner.classList.remove("visible"), SERVICE_DOWN_BANNER_DURATION_MS);
}

function startCooldown(submitButton) {
  let secondsRemaining = Math.ceil(COOLDOWN_DURATION_MS / 1000);
  submitButton.textContent = `Wait ${secondsRemaining}s`;

  const cooldownIntervalId = setInterval(() => {
    secondsRemaining -= 1;
    if (secondsRemaining <= 0) {
      clearInterval(cooldownIntervalId);
      submitButton.disabled = false;
      submitButton.textContent = "Research";
    } else {
      submitButton.textContent = `Wait ${secondsRemaining}s`;
    }
  }, 1000);
}

function renderBrief(briefData) {
  const resultsContainer = document.getElementById("results");
  resultsContainer.innerHTML = "";

  Object.keys(FIELD_LABELS).forEach((key, index) => {
    if (!briefData[key]) return;

    const fieldDiv = document.createElement("div");
    fieldDiv.className = "field";
    fieldDiv.style.animationDelay = `${index * 60}ms`;
    fieldDiv.innerHTML = `
      <div class="field-label">${FIELD_LABELS[key]}</div>
      <div class="field-value">${briefData[key]}</div>
    `;
    resultsContainer.appendChild(fieldDiv);
  });
}
</script>

</body>
</html>
